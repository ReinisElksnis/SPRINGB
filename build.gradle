plugins {
    id 'java'
    id 'jvm-test-suite'
    id 'jacoco'
    id 'checkstyle'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'lv.ray'
version = '0.0.1-SNAPSHOT'
description = 'SPRINGB'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

ext {
    // Matches the version spring-boot-dependencies:4.1.1 itself manages (testcontainers-bom is a
    // nested BOM import there, which the Gradle dependency-management plugin doesn't follow
    // transitively) - bump this alongside the Spring Boot version.
    set('testcontainersVersion', "2.0.5")
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-rest'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-session-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
}

dependencyManagement {
    imports {
        mavenBom "org.testcontainers:testcontainers-bom:${testcontainersVersion}"
    }
}

// Two tiers, kept on separate source sets so the fast one stays fast: `test` is plain JUnit 5 +
// Mockito + AssertJ (all pulled in transitively by spring-boot-starter-test) with every
// collaborator mocked - no Spring context, no database, milliseconds per test. `integrationTest`
// boots the real application context against a real Testcontainers Postgres (and, for the web
// layer tests, drives it through the real Spring Security filter chain via MockMvc) - seconds per
// test, but the only tier that can catch a broken transaction boundary or a misconfigured security
// filter chain. See src/test/java vs src/integrationTest/java.
testing {
    suites {
        test {
            useJUnitJupiter()

            dependencies {
                implementation 'org.springframework.boot:spring-boot-starter-test'
            }
        }

        integrationTest(JvmTestSuite) {
            useJUnitJupiter()

            dependencies {
                implementation project()
                implementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
                implementation 'org.springframework.boot:spring-boot-starter-data-rest-test'
                implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client-test'
                implementation 'org.springframework.boot:spring-boot-starter-security-test'
                implementation 'org.springframework.boot:spring-boot-starter-session-jdbc-test'
                implementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
                implementation 'org.springframework.boot:spring-boot-testcontainers'
                implementation 'org.testcontainers:testcontainers-junit-jupiter'
                implementation 'org.testcontainers:testcontainers-postgresql'
            }

            targets {
                all {
                    testTask.configure {
                        shouldRunAfter(tasks.test)
                    }
                }
            }
        }
    }
}

// Reports style issues without failing the build - this codebase predates the ruleset (tabs,
// Allman braces, star imports are all intentional here), so it's a signal for new code, not a gate.
checkstyle {
    toolVersion = '10.20.2'
    configFile = file('config/checkstyle/checkstyle.xml')
    ignoreFailures = true
    maxWarnings = Integer.MAX_VALUE
}

jacoco {
    // 0.8.12 can't instrument Java 25 bytecode (class file major version 69) - official Java 25
    // support landed in 0.8.14.
    toolVersion = '0.8.15'
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test'), tasks.named('integrationTest')
    executionData tasks.named('test').get(), tasks.named('integrationTest').get()
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestReport')
}
