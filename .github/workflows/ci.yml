name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Fast tier first: no Spring context, no Docker - fails in seconds if it's going to fail.
      - name: Run unit tests
        run: ./gradlew test

      # Slower tier + Checkstyle (report-only, see build.gradle) + the aggregated Jacoco coverage
      # report (both tiers' exec data) - all wired into the standard `check` lifecycle task.
      # Testcontainers spins up a real Postgres via the Docker daemon this runner already has.
      - name: Build and verify (integration tests, Checkstyle, coverage)
        run: ./gradlew build

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: build/reports/tests/test/

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: build/reports/tests/integrationTest/

      - name: Upload Checkstyle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-report
          path: build/reports/checkstyle/

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/
