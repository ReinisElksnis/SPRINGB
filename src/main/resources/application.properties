spring.application.name=SPRINGB
server.port=8080

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/springb_db
spring.datasource.username=myuser
spring.datasource.password=secret
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
# Flyway (below) owns the schema now - Hibernate only checks the entities still match it, it never
# creates or alters a table. If this fails on startup, the fix is a new migration, not this flag.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Spring Session Configuration
spring.session.store-type=jdbc
# Disabled: spring_session/spring_session_attributes are created by V1__create_initial_schema.sql
# instead, so every table in this database - this one included - is versioned through one
# migration history rather than half through Flyway and half through this flag.
spring.session.jdbc.initialize-schema=never

# Flyway Configuration
# This app ran under ddl-auto=update before Flyway existed, so every environment created before
# this change already has the V1 schema but no Flyway history table. baseline-on-migrate lets
# Flyway adopt that existing schema as "already at V1" instead of failing (non-empty schema, no
# history table) or trying to re-run V1's CREATE TABLEs against tables that already exist. A
# genuinely empty database (a fresh Testcontainers container, a new environment) is unaffected -
# baselining only triggers for a non-empty, unversioned schema - so it runs V1 from scratch there.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Pre-Flyway schema (Hibernate ddl-auto=update)

# Session Length
# How long a login survives without activity. Spring Session reads spring.session.timeout and
# falls back to server.servlet.session.timeout when it is unset. Accepts a duration suffix
# (s, m, h, d); a bare number is read as seconds. This is the value stored per row in
# SPRING_SESSION.MAX_INACTIVE_INTERVAL, so it applies from the next login onwards.
spring.session.timeout=30m

# Lifetime of the browser cookie that carries the session id. Left unset it is a session cookie,
# discarded when the browser closes - the login does not outlive the window. Set a max-age to keep
# visitors signed in across browser restarts, and keep it <= spring.session.timeout above so the
# cookie never outlives the row it points at.
#server.servlet.session.cookie.max-age=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Enable once this is served over HTTPS - the cookie is then withheld on plain HTTP.
#server.servlet.session.cookie.secure=true

# How often expired rows are swept from SPRING_SESSION. Expiry is enforced on read regardless;
# this only controls when the dead rows are deleted.
spring.session.jdbc.cleanup-cron=0 * * * * *

# Registration and Sign-in Policy
springb.auth.min-username-length=3
springb.auth.min-password-length=8
springb.auth.email-pattern=^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$
springb.auth.default-role=ROLE_USER
